name: Main

on:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew assembleCi

      - name: Sign APK
        env:
          CI_SIGNING_KS: ${{ secrets.CI_SIGNING_KS }}
          CI_SIGNING_KS_PASSWORD: ${{ secrets.CI_SIGNING_KS_PASSWORD }}
        working-directory: ./app/build/outputs/apk/ci/
        run: |
          if [ -n "$CI_SIGNING_KS" ]; then
            echo "$CI_SIGNING_KS" | base64 --decode > keystore.jks
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --in app-ci-unsigned.apk --out app-ci.apk --ks keystore.jks --ks-pass 'env:CI_SIGNING_KS_PASSWORD'
          else
            # No signing secret on this fork: sign with a throwaway key so the APK is still installable
            keytool -genkeypair -v -keystore ci.keystore -alias ci -keyalg RSA -keysize 2048 -validity 10000 -storepass changeit -keypass changeit -dname "CN=AVNC-CI"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --in app-ci-unsigned.apk --out app-ci.apk --ks ci.keystore --ks-pass pass:changeit
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/ci/app-ci.apk